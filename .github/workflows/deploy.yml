name: Deploy to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      
      - name: Build
        run: npm run build
        env:
          VITE_PINATA_JWT: ${{ secrets.VITE_PINATA_JWT }}
          VITE_IPFS_GATEWAY: ${{ secrets.VITE_IPFS_GATEWAY }}
          VITE_NFT_CONTRACT_ADDRESS: ${{ secrets.VITE_NFT_CONTRACT_ADDRESS }}
      
      - name: Debug - Check if env vars are set
        run: |
          echo "Checking environment variables..."
          if [ -z "${{ secrets.VITE_PINATA_JWT }}" ]; then echo "VITE_PINATA_JWT is empty"; else echo "VITE_PINATA_JWT is set"; fi
          if [ -z "${{ secrets.VITE_IPFS_GATEWAY }}" ]; then echo "VITE_IPFS_GATEWAY is empty"; else echo "VITE_IPFS_GATEWAY is set"; fi
          if [ -z "${{ secrets.VITE_NFT_CONTRACT_ADDRESS }}" ]; then echo "VITE_NFT_CONTRACT_ADDRESS is empty"; else echo "VITE_NFT_CONTRACT_ADDRESS is set"; fi
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
  
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
